<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href='https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<title>BusAdmin Login</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  background:linear-gradient(135deg,#0f172a,#1e293b);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
}

.l-form{
  position:relative;
  width:900px;
  height:520px;
  display:flex;
  border-radius:20px;
  overflow:hidden;
  background:#020617;
  box-shadow:0 25px 60px rgba(0,0,0,0.5);
}

.shape1,.shape2{
  position:absolute;
  border-radius:50%;
  filter:blur(80px);
}

.shape1{
  width:300px;height:300px;
  background:#3b82f6;
  top:-100px;left:-100px;
}

.shape2{
  width:300px;height:300px;
  background:#7c3aed;
  bottom:-100px;right:-100px;
}

.form{
  display:flex;
  width:100%;
}

.form__img{
  width:50%;
  object-fit:cover;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:80px;
}

.form__content{
  width:50%;
  padding:40px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  animation:fade 0.6s ease;
}

.logo-container{
  display:flex;
  justify-content:center;
  margin-bottom:15px;
  animation:fadeLogo 0.8s ease;
}

.logo-container .logo-icon{
  width:80px;
  height:80px;
  background:linear-gradient(135deg,#3b82f6,#7c3aed);
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  box-shadow:0 10px 25px rgba(59,130,246,0.4);
  transition:0.3s;
}

.logo-container .logo-icon:hover{
  transform:scale(1.05);
}

.form__title{
  font-size:26px;
  text-align:center;
}

.form__subtitle{
  font-size:13px;
  color:#94a3b8;
  margin-bottom:20px;
  text-align:center;
}

.form__div{
  display:flex;
  align-items:center;
  margin-bottom:20px;
}

.form__icon{
  margin-right:10px;
  font-size:20px;
  color:#3b82f6;
}

.form__div-input{
  position:relative;
  flex:1;
}

.form__input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.1);
  background:#0f172a;
  color:#fff;
  outline:none;
}

.form__label{
  position:absolute;
  top:12px;
  left:12px;
  color:#64748b;
  font-size:13px;
  transition:0.3s;
}

.form__input:focus + .form__label,
.form__input:not(:placeholder-shown) + .form__label{
  top:-8px;
  font-size:10px;
  background:#020617;
  padding:0 5px;
  color:#3b82f6;
}

.form__button{
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#3b82f6,#6366f1);
  color:#fff;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

.form__button:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(59,130,246,0.4);
}

.form__forgot{
  font-size:12px;
  color:#3b82f6;
  margin-bottom:15px;
  text-align:right;
  text-decoration:none;
}

.form__forgot:hover{
  text-decoration:underline;
}

.error-message{
  background:rgba(239,68,68,0.2);
  color:#ef4444;
  padding:10px;
  border-radius:8px;
  margin-bottom:15px;
  text-align:center;
  font-size:13px;
}

@keyframes fade{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes fadeLogo{
  from{opacity:0;transform:translateY(-10px)}
  to{opacity:1;transform:translateY(0)}
}

@media(max-width:768px){
  .l-form{flex-direction:column;height:auto;width:95%;}
  .form__img{display:none;}
  .form__content{width:100%;}
}
</style>
</head>
<body>
<div class="l-form">
<div class="shape1"></div>
<div class="shape2"></div>
<div class="form">
  <div class="form__img">
    🚌
  </div>
  <form class="form__content" method="post">
    {% csrf_token %}
    <div class="logo-container">
      <div class="logo-icon">🚌</div>
    </div>
    <h1 class="form__title">BusAdmin</h1>
    <p class="form__subtitle">
      Plateforme intelligente de gestion des transports
    </p>
    
    {% if error %}
    <div class="error-message">
      ❌ {{ error }}
    </div>
    {% endif %}
    
    <div class="form__div">
      <div class="form__icon"><i class='bx bx-user'></i></div>
      <div class="form__div-input">
        <input type="text" name="username" class="form__input" placeholder=" ">
        <label class="form__label">Nom d'utilisateur</label>
      </div>
    </div>
    <div class="form__div">
      <div class="form__icon"><i class='bx bx-lock'></i></div>
      <div class="form__div-input">
        <input type="password" name="password" class="form__input" placeholder=" ">
        <label class="form__label">Mot de passe</label>
      </div>
    </div>
    <a href="#" class="form__forgot">Mot de passe oublié ?</a>
    <input type="submit" class="form__button" value="Se connecter">
  </form>
</div>
</div>
</body>
</html>
